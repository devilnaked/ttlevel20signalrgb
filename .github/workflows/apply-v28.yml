name: Apply V28 update

on:
  push:
    paths:
      - .github/workflows/apply-v28.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update plugin and documentation
        shell: python
        run: |
          from pathlib import Path

          plugin_path = Path("Thermaltake_Level20_RGB.js")
          plugin = plugin_path.read_text(encoding="utf-8")
          replacements = {
              "// Thermaltake Level 20 RGB Keyboard - V27 Electrical Map Final Fix": "// Thermaltake Level 20 RGB Keyboard - V28 Vertical Wave Fix",
              "// V27: capture-confirmed Menu index and full seven-zone left underglow map.": "// V28: Physical 2D is now the default so vertical Canvas effects retain per-row Y phases.\n// Horizontal Sync remains available as a compatibility option for strictly horizontal effects.",
              'export function Name() { return "Thermaltake Level 20 RGB (V27 Electrical Map Final Fix)"; }': 'export function Name() { return "Thermaltake Level 20 RGB (V28 Vertical Wave Fix)"; }',
              '{ property: "GeometryMode", group: "lighting", label: "Geometry Mode", type: "combobox", values: ["Horizontal Sync", "Physical 2D"], default: "Horizontal Sync" }': '{ property: "GeometryMode", group: "lighting", label: "Geometry Mode", type: "combobox", values: ["Physical 2D", "Horizontal Sync"], default: "Physical 2D" }',
          }
          for old, new in replacements.items():
              if old not in plugin:
                  raise SystemExit(f"Expected plugin text not found: {old}")
              plugin = plugin.replace(old, new, 1)
          plugin_path.write_text(plugin, encoding="utf-8")

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          readme = readme.replace(
              "5. Start with `Geometry Mode: Horizontal Sync`.",
              "5. Use `Geometry Mode: Physical 2D` (the default). This preserves correct horizontal and vertical Canvas effects. `Horizontal Sync` remains available as an optional compatibility mode."
          )
          readme_path.write_text(readme, encoding="utf-8")

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          entry = "# Changelog\n\n## 1.0.1 — Vertical effect fix\n\n- Changed the default geometry mode to **Physical 2D**.\n- Fixed top-to-bottom and bottom-to-top Canvas effects changing the entire keyboard at once.\n- Kept **Horizontal Sync** as an optional compatibility mode.\n- No HID protocol, handshake, packet, or electrical-map changes.\n\n"
          if "## 1.0.1 — Vertical effect fix" not in changelog:
              changelog = changelog.replace("# Changelog\n\n", entry, 1)
          changelog_path.write_text(changelog, encoding="utf-8")

      - name: Remove one-time workflow
        run: rm .github/workflows/apply-v28.yml

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Thermaltake_Level20_RGB.js README.md CHANGELOG.md .github/workflows/apply-v28.yml
          git commit -m "Fix vertical effects with Physical 2D default"
          git push
